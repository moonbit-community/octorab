name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        channel: [latest, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- ${{ matrix.channel }}
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Validate
        run: |
          moon version --all
          moon update
          # Keep existing public Show implementations during this compatibility repair.
          moon check --target native --deny-warn --warn-list -20-27
          moon fmt
          moon info --target native
          git diff --exit-code
          moon test --target native
          moon test --target native --release
